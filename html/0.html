<!DOCTYPE html>
<html lang="en">
    <head>
        <title>&lrm;</title>
        <link rel="icon" href="../img/hollow.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
                    }
			}
	    </script>
    </head>

    <style>
        @import "../css/0.css"; 
    </style>

<body id="we">
    <warning class="selectDisable">
        <div id="danger">
            <p>
                You should not have <br>come here
            </p>
            <button id="consent">ACCEPT YOUR MISTAKE</button>
        </div>
        
    </warning>
    <img src="../img/hollow.png" id="darkness" class="selectDisable dark" draggable="true">
    <heart>
        <img src="../img/0/heart.png" id="soul" class="selectDisable form threat" draggable="false">
        <img src="../img/0/why.png" id="mistake" class="selectDisable hesitation" draggable="false">
        <img src="../img/0/regret.png" id="regret" class="selectDisable piercing" draggable="false">
        <img src="../img/0/pierced.png" id="ichor" class="selectDisable before" draggable="false">
    </heart>
    <script type="module" src="../js/heart.js"></script>
</body>
    <audio src="../media/0/heart.mp3" type="audio/mpeg" id="pulse"></audio>
    <audio src="../media/0/dead.mp3" type="audio/mpeg" id="dead"></audio>
</head>

<script>
  document.getElementById('soul').addEventListener('animationiteration', () => {
    document.getElementById('pulse').currentTime = 0;
    document.getElementById('pulse').play()
  });

    window.addEventListener('load', pierce);
    window.addEventListener('load', warn);
    
    function pierce() {
    document.getElementById('soul').addEventListener('click', function (e) {
        document.getElementById('soul').className -= " alive threat";
        document.getElementById('mistake').className -= " hesitation";
        document.getElementById('regret').className -= " piercing";
        document.getElementById('ichor').className -= " before";
        document.getElementById('soul').className += " selectDisable killed slaughtered form";
        document.getElementById('mistake').className += " selectDisable regret";
        document.getElementById('darkness').className += " consume";
        document.getElementById('regret').className += " pierced";
        document.getElementById('ichor').className += " after";
        document.getElementById('dead').play();
        document.body.style.cursor = 'default';
    });
    };

    function warn() {
    document.getElementById('consent').addEventListener('click', function (e) {
        document.getElementById('soul').className += " alive";
        document.getElementById('we').className += " cursed";
        document.getElementById('danger').className += " pact";
        document.getElementById('pulse').currentTime = 0;
        document.getElementById('pulse').play()
    });
    };

</script>
